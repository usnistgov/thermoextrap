[build-system]
build-backend = "uv_build"
requires = [
    "uv-build>=0.8.22,<0.9.0",
]

[project]
name = "thermoextrap"
version = "1.0.1.dev0"
description = "Thermodynamic extrapolation"
readme = "README.md"
keywords = [
    "thermoextrap",
]
license = "NIST-PD"
license-files = [ "LICENSE" ]
authors = [
    { name = "Jacob Monroe", email = "jacob.monroe@nist.gov" },
    { name = "William Krekelberg", email = "wpk@nist.gov" },
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "attrs>=24.1.0",
    "cmomy>=1.0.2",
    "dm-tree",
    "lazy-loader",
    "module-utilities[inherit]>=0.11.0",
    "numba>=0.60.0",
    "numpy>=1.26.0",
    "packaging",
    "scipy",
    "sympy",
    "xarray>=2024.7.0",
]
optional-dependencies.accel = [
    "bottleneck",
]
optional-dependencies.all = [
    "thermoextrap[accel,gpr,mbar,parallel,viz]",
]
optional-dependencies.gpr = [
    "gpflow>=2.6.0",
    "tensorflow>=2.13",
    "tensorflow-probability[tf]~=0.24.0",
]
optional-dependencies.mbar = [
    "pymbar[jax]>=4.0",
]
optional-dependencies.openmm = [
    "openmm",
]
optional-dependencies.parallel = [
    "dask[complete]",
]
optional-dependencies.viz = [
    "matplotlib",
]
urls.Documentation = "https://pages.nist.gov/thermoextrap/"
urls.Homepage = "https://github.com/usnistgov/thermoextrap"

[dependency-groups]
dev = [
    "nbconvert",
    "righttyper",
    "thermoextrap[all]",
    { include-group = "mypy" },
    { include-group = "notebook" },
    { include-group = "nox" },
    # { include-group = "pytest-accept" },
    { include-group = "test" },
    { include-group = "test-notebook" },
    { include-group = "typecheck" },
]
test = [
    "pytest-cov",
    "pytest-env",
    "pytest-sugar",
    "pytest-xdist>3.6.0",
    "thermoextrap[gpr,mbar]",
    { include-group = "pandas" },
    { include-group = "pytest" },
]
docs = [
    "autodocsumm",
    "myst-nb",
    "pyenchant",
    "sphinx>=5.3.0",
    "sphinx-book-theme",
    "sphinx-copybutton",
    "sphinxcontrib-spelling",
    "thermoextrap[gpr,mbar,viz]",
]
# other environments
docs-live = [
    "sphinx-autobuild",
    { include-group = "docs" },
]
docs-spelling = [
    "pyenchant",
    "sphinxcontrib-spelling",
    { include-group = "docs" },
]
# other packages/tools
ipython = [ "ipython" ]
mypy = [ "mypy>=1.15.0", "orjson" ]
notebook = [ "ipykernel", "nbclient" ]
nox = [ "nox>=2025.5.1" ]
pandas = [ "pandas" ]
pylint = [ "pylint" ]
pytest = [ "pytest" ]
pytest-accept = [ "pytest-accept" ]
test-extras = [
    { include-group = "test" },
]
test-notebook = [
    "nbval",
    "thermoextrap[viz]",
    { include-group = "test" },
]
typecheck = [
    "matplotlib; python_version=='3.12'",
    "pandas-stubs",
    "scipy-stubs; python_version>='3.10'",
    "thermoextrap[gpr,mbar]",
    "types-tensorflow",
    { include-group = "pylint" },
    { include-group = "pytest" },
]

# * uv -------------------------------------------------------------------------

[tool.uv]
required-version = ">=0.7.15"
default-groups = [ "dev" ]
dependency-groups.dev.requires-python = ">=3.12"
dependency-groups.docs-live.requires-python = ">=3.12"
dependency-groups.docs-spelling.requires-python = ">=3.12"
dependency-groups.docs.requires-python = ">=3.12"
# other tools
dependency-groups.ipython.requires-python = ">=3.12"
dependency-groups.mypy.requires-python = ">=3.12"
dependency-groups.notebook.requires-python = ">=3.12"
dependency-groups.nox.requires-python = ">=3.12"
fork-strategy = "requires-python"
managed = true
build-backend.source-include = [ "tests/**" ]
pip.annotation-style = "line"
pip.generate-hashes = true

[tool.nbqa]
# * Checks ---------------------------------------------------------------------

exclude.ruff = "^examples/gpr_active_learning|^examples/usage/gpr"

[tool.repo-review]
ignore = [
    "GH",     # enable for actions
    "PC140",  # do this externally
    "PC170",  # pygrep
    "PC901",  # ci message
    "RTD",
    "NOX103", # I prefer using "nox.options.sessions"
]

[tool.codespell]
skip = "examples/*"

[tool.check-wheel-contents]
toplevel = [
    "thermoextrap",
]
src_dir = [
    "src",
]

[tool.pyproject-fmt]
# tensorflow max allowed python version (for now)
max_supported_python = "3.12"

[tool.typos]
default.extend-ignore-identifiers-re = [
    "struc_.*",
    ".*equil.*",
    "NDArray.*",
]
default.extend-identifiers.gather_nd = "gather_nd"
default.extend-identifiers.numer = "numer"
default.extend-identifiers.pertNumer = "pertNumer"
files.extend-exclude = [ "spelling_wordlist.txt" ]

[tool.pytest]
# * Testing --------------------------------------------------------------------

ini_options.addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--doctest-modules",
    "--doctest-glob=*.md",
    "--pyargs",
    "--cov-config=pyproject.toml",
    "--ignore-glob='**/legacy/**",
    "-n",
    "4",
]
ini_options.testpaths = [
    "README.md",
    "tests",
    "thermoextrap",
]
ini_options.minversion = "8"
ini_options.log_cli_level = "INFO"
ini_options.log_level = "INFO"
ini_options.xfail_strict = true
ini_options.filterwarnings = [
    "error",
    "ignore: Type google:DeprecationWarning",
    "ignore: distutils Version classes are deprecated:DeprecationWarning",
    "ignore: pkg_resources is deprecated as an API:DeprecationWarning",
    "ignore: FNV hashing is not implemented in Numba:UserWarning",
    "ignore: A kernel object:UserWarning",
    "ignore: Unknown solver options",
    "ignore::docstring_inheritance.DocstringInheritanceWarning",
    "ignore: Module thermoextrap was never imported:coverage.exceptions.CoverageWarning",
    "ignore: No data was collected:coverage.exceptions.CoverageWarning",
    "ignore: pkg_resources is deprecated:UserWarning",
    "ignore: invalid escape sequence:SyntaxWarning",
    "ignore: The default datetime:DeprecationWarning",
    "ignore: importing 'Const' from 'astroid' is deprecated:DeprecationWarning",
]

[tool.pytest_env]
NUMBA_CACHE_DIR = { value = "{PWD}/.numba_cache", transform = true, skip_if_set = true }

[tool.coverage]
run.branch = true
run.parallel = true
paths.source = [
    "src/",
    ".nox/**/site-packages/",
]
# show_missing = true
report.exclude_also = [
    "@overload",
    "if TYPE_CHECKING:",
]
report.include = [
    "src/*",
]
report.omit = [
    "*/_typing.py",
    "*/vendored/*",
]

# * typecheck ---------------------------------------------------------------------

[tool.mypy]
files = [
    "src",
    "tests",
]
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
exclude = [
    ".eggs",
    ".tox",
    ".nox",
    ".venv",
    ".numba_cache",
    "docs",
]
check_untyped_defs = true
strict = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
    "matplotlib.*",
    "scipy.*",
    "sympy.*",
    "pymbar.*",
    "tensorflow_probability.*",
]

[[tool.mypy.overrides]]
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
module = [
    "tests.*",
]

[[tool.mypy.overrides]]
check_untyped_defs = false
module = [
    "tests.legacy.*",
]

[tool.pyright]
include = [
    "src",
    "tests",
]
exclude = [
    "**/__pycache__",
    ".tox/**",
    ".nox/**",
    ".venv/**",
    "**/.mypy_cache",
    "**/.numba_cache",
    "**/legacy/*.py",
]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = [
    "noxfile.py",
    "tools/*.py",
    "src/thermoextrap/*.py",
    "src/thermoextrap/core/*.py",
    "src/thermoextrap/gpr_active/ig_active.py",
    # "src/thermoextrap/gpr_active/active_utils.py",
    # "src/thermoextrap/gpr_active/gp_models.py",
    "src/thermoextrap/gpr_active/sine_active.py",
    "tests/test_typing.py",
]
reportDuplicateImport = true
reportInvalidStubStatement = true
reportOverlappingOverload = true
reportPropertyTypeMismatch = true
reportUntypedClassDecorator = true
reportUntypedFunctionDecorator = true
reportUntypedNamedTuple = true
reportUnusedImport = true
# Extra flags
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = true
reportUnreachable = "warning"

[tool.pytype]
inputs = [
    "src",
    "tests",
]

# * Dependency creation --------------------------------------------------------

[tool.pyproject2conda]
user-config = "config/userconfig.toml"
template-python = "requirements/py{py}-{env}"
template = "requirements/{env}"
name = "py{py}-{env}"
python = "default"
channels = "conda-forge"
style = "yaml"
deps = "pip"
dependencies.pytest-accept = { pip = true }
dependencies.matplotlib = { skip = true, packages = "matplotlib-base" }
dependencies.lazy-loader = { skip = true, packages = "lazy_loader" }
dependencies.dask = { skip = true, packages = "dask" }
dependencies.gpflow = { pip = true }
dependencies.tensorflow = { pip = true }
dependencies.tensorflow-probability = { pip = true }
dependencies.pymbar = { pip = true }
dependencies.jax = { pip = true }
dependencies.module-utilities = { packages = "docstring-inheritance" }
envs.dev.groups = [ "dev" ]
envs.dev.python = "default"
envs.test.groups = [ "test" ]
envs.test.python = "all"
envs.test-extras.groups = [ "test-extras" ]
envs.test-extras.skip-package = true
envs.test-extras.python = "all"
envs.uvx-tools.reqs = [
    # these used solely for specking tools to be used with uvx ...
    "conda-lock>=2.5.5",
    "cruft",
    "grayskull>=2.5.3",
    "nbqa>=1.8.4",
    "pre-commit>=4.0.0",
    "pre-commit-uv",
    "prek",
    "pyrefly>=0.37.0",
    "pyright>=1.1.396",
    "basedpyright>=1.31.3",
    "scriv",
    "twine>=5.0.0",
    "ty",
]
envs.uvx-tools.groups = [
    "mypy",
    "nox",
]
envs.uvx-tools.skip-package = true
envs.uvx-tools.style = "requirements"

# * Other tools ----------------------------------------------------------------

[tool.scriv]
format = "md"
md_header_level = "2"
new_fragment_template = "file: changelog.d/templates/new_fragment.md.j2"

[tool.commitizen]
use_shortcuts = true

[tool.cruft]
