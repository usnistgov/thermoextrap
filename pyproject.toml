[build-system]
build-backend = "uv_build"
requires = [
    "uv-build>=0.8.22,<0.9.0",
]

[project]
name = "thermoextrap"
version = "1.0.1.dev0"
description = "Thermodynamic extrapolation"
readme = "README.md"
keywords = [
    "thermoextrap",
]
license = "NIST-PD"
license-files = [ "LICENSE" ]
authors = [
    { name = "Jacob Monroe", email = "jacob.monroe@nist.gov" },
    { name = "William Krekelberg", email = "wpk@nist.gov" },
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "attrs>=24.1.0",
    "cmomy>=1.0.2",
    "dm-tree",
    "lazy-loader",
    "module-utilities[inherit]>=0.11.0",
    "numba>=0.60.0",
    "numpy>=1.26.0",
    "packaging",
    "scipy",
    "sympy",
    "xarray>=2024.7.0",
]

[project.optional-dependencies]
accel = [
    "bottleneck",
]
all = [
    "thermoextrap[accel,gpr,mbar,parallel,viz]",
]
gpr = [
    "gpflow>=2.6.0",
    "setuptools<81.0.0",                                                                                         # gpflow bug.  Needs this, but doesn't include by default.
    "tensorflow>=2.16,<2.17; python_version<'3.13' and (sys_platform=='darwin' and platform_machine=='x86_64')",
    "tensorflow>=2.16; python_version<'3.13' and (sys_platform!='darwin' or platform_machine!='x86_64')",
    "tensorflow>=2.16; python_version>='3.13'",
    "tensorflow-probability[tf]~=0.24.0",
]
mbar = [
    "pymbar[jax]>=4.0",
]
openmm = [
    "openmm",
]
parallel = [
    "dask[complete]",
]
viz = [
    "matplotlib",
]

[project.urls]
Documentation = "https://pages.nist.gov/thermoextrap/"
Homepage = "https://github.com/usnistgov/thermoextrap"

[dependency-groups]
dev = [
    "nbconvert",
    "righttyper",
    "thermoextrap[all]",
    { include-group = "mypy" },
    { include-group = "notebook" },
    { include-group = "nox" },
    # { include-group = "pytest-accept" },
    { include-group = "test" },
    { include-group = "test-notebook" },
    { include-group = "typecheck" },
]
test = [
    "pytest-cov",
    "pytest-env",
    "pytest-sugar",
    "pytest-xdist>3.6.0",
    "thermoextrap[gpr,mbar]",
    { include-group = "pandas" },
    { include-group = "pytest" },
]
docs = [
    "autodocsumm",
    "myst-nb",
    "pyenchant",
    "sphinx>=5.3.0",
    # options
    "sphinx-book-theme",
    "sphinx-copybutton",
    "sphinxcontrib-spelling",
    "thermoextrap[gpr,mbar,viz]",
]
# other environments
docs-live = [
    "sphinx-autobuild",
    { include-group = "docs" },
]
docs-spelling = [
    "pyenchant",
    "sphinxcontrib-spelling",
    { include-group = "docs" },
]
ipython = [ "ipython" ]
mypy = [ "mypy>=1.15.0", "orjson" ]
notebook = [ "ipykernel", "nbclient" ]
nox = [ "nox>=2025.5.1" ]
pandas = [ "pandas<3.0" ]
pylint = [ "pylint" ]
pytest = [ "pytest" ]
pytest-accept = [ "pytest-accept" ]
test-extras = [
    { include-group = "test" },
]
test-notebook = [
    "nbval",
    "thermoextrap[viz]",
    { include-group = "test" },
]
typecheck = [
    "matplotlib; python_version=='3.12'",
    "pandas-stubs",
    "scipy-stubs; python_version>='3.10'",
    "thermoextrap[gpr,mbar]",
    "types-tensorflow",
    { include-group = "pylint" },
    { include-group = "pytest" },
]

# * uv -------------------------------------------------------------------------

[tool.uv]
required-version = ">=0.7.15"
default-groups = [ "dev" ]
fork-strategy = "requires-python"
environments = [
    "python_version<'3.14' and (sys_platform=='darwin' and platform_machine=='x86_64')",
    "sys_platform!='darwin' or platform_machine!='x86_64'",
]
managed = true
build-backend.source-include = [ "tests/**" ]
pip.annotation-style = "line"
pip.generate-hashes = true

[tool.uv.dependency-groups]
dev.requires-python = ">=3.12"
docs.requires-python = ">=3.12"
docs-live.requires-python = ">=3.12"
docs-spelling.requires-python = ">=3.12"
# other tools
ipython.requires-python = ">=3.12"
mypy.requires-python = ">=3.12"
notebook.requires-python = ">=3.12"
nox.requires-python = ">=3.12"

# * Checks ---------------------------------------------------------------------

[tool.repo-review]
ignore = [
    "GH",     # enable for actions
    "NOX103", # I prefer using "nox.options.sessions"
    "PC140",  # do this externally
    "PC170",  # pygrep
    "PC901",  # ci message
    "RTD",
]

[tool.codespell]
skip = "examples/*"

[tool.check-wheel-contents]
src_dir = [
    "src",
]
toplevel = [
    "thermoextrap",
]

[tool.pyproject-fmt]
expand_tables = [
    "project.entry-points",
    "project.optional-dependencies",
    "project.scripts",
    "project.urls",
    "tool.mypy.overrides",
    "tool.pyproject2conda",
    "tool.pyright.executionEnvironments",
    "tool.pytest",
    "tool.typos",
    "tool.uv.dependency-groups",
]
indent = 4
keep_full_version = true
max_supported_python = "3.13"

[tool.typos.default]
extend-ignore-identifiers-re = [
    ".*equil.*",
    "NDArray.*",
    "struc_.*",
]

[tool.typos.default.extend-identifiers]
gather_nd = "gather_nd"
numer = "numer"
pertNumer = "pertNumer"

[tool.typos.files]
extend-exclude = [ "spelling_wordlist.txt" ]

# * Testing --------------------------------------------------------------------

[tool.pytest.ini_options]
addopts = [
    "--cov-config=pyproject.toml",
    "--doctest-glob=*.md",
    "--doctest-modules",
    "--ignore-glob='**/legacy/**",
    "--pyargs",
    "--strict-config",
    "--strict-markers",
    "-ra",
    # xdist
    "-n",
    "4",
]
testpaths = [
    "README.md",
    "tests",
    "thermoextrap",
]
# options
filterwarnings = [
    "error",
    "ignore: A kernel object:UserWarning",
    "ignore: FNV hashing is not implemented in Numba:UserWarning",
    "ignore: Module thermoextrap was never imported:coverage.exceptions.CoverageWarning",
    "ignore: No data was collected:coverage.exceptions.CoverageWarning",
    "ignore: The default datetime:DeprecationWarning",
    "ignore: Type google:DeprecationWarning",
    "ignore: Unknown solver options",
    "ignore: distutils Version classes are deprecated:DeprecationWarning",
    "ignore: importing 'Const' from 'astroid' is deprecated:DeprecationWarning",
    "ignore: invalid escape sequence:SyntaxWarning",
    "ignore: pkg_resources is deprecated as an API:DeprecationWarning",
    "ignore: pkg_resources is deprecated:UserWarning",
]
log_cli_level = "INFO"
log_level = "INFO"
minversion = "8"
xfail_strict = true

[tool.pytest_env]
NUMBA_CACHE_DIR = { value = "{PWD}/.numba_cache", transform = true, skip_if_set = true }

[tool.coverage]
run.branch = true
run.parallel = true
paths.source = [
    "src/",
    # needed for testing source if not editable install
    ".nox/**/site-packages/",
]
report.exclude_also = [
    "@overload",
    "if TYPE_CHECKING:",
]
report.include = [
    "src/*",
]
report.omit = [
    "*/_typing.py",
    "*/vendored/*",
]

# report.show_missing = true

# * typecheck ---------------------------------------------------------------------

[tool.mypy]
exclude = [
    ".eggs",
    ".nox",
    ".numba_cache",
    ".tox",
    ".venv",
    "docs",
]
files = [
    "src",
    "tests",
]
strict = true
# options
check_untyped_defs = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
    "matplotlib.*",
    "pymbar.*",
    "scipy.*",
    "sympy.*",
    "tensorflow_probability.*",
]

[[tool.mypy.overrides]]
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
module = [
    "tests.*",
]

[[tool.mypy.overrides]]
check_untyped_defs = false
module = [
    "tests.legacy.*",
]

[tool.pyright]
exclude = [
    "**/.mypy_cache",
    "**/.numba_cache",
    "**/__pycache__",
    "**/legacy/*.py",
    ".nox/**",
    ".tox/**",
    ".venv/**",
]
include = [
    "src",
    "tests",
]
strict = [
    "noxfile.py",
    "src/thermoextrap/*.py",
    "src/thermoextrap/core/*.py",
    "src/thermoextrap/gpr_active/ig_active.py",
    "tools/*.py",
    # "src/thermoextrap/gpr_active/active_utils.py",
    # "src/thermoextrap/gpr_active/gp_models.py",
    "src/thermoextrap/gpr_active/sine_active.py",
    "tests/test_typing.py",
]
typeCheckingMode = "standard"
# options
# reportMissingSuperCall = true
deprecateTypingAliases = true
enableReachabilityAnalysis = false
enableTypeIgnoreComments = false
reportCallInDefaultInitializer = true
reportImplicitOverride = true
reportImportCycles = true
reportOverlappingOverload = true
reportPropertyTypeMismatch = true
reportUninitializedInstanceVariable = true
reportUnnecessaryTypeIgnoreComment = true
reportUnreachable = "warning"
reportUntypedClassDecorator = true
reportUntypedFunctionDecorator = true
reportUnusedCallResult = true
# type-checkers should type-check; linters should lint
reportImplicitStringConcatenation = false
reportPrivateImportUsage = false
reportPrivateUsage = false
reportUnusedImport = false
reportUnusedVariable = false

[[tool.pyright.executionEnvironments]]
reportArgumentType = false
reportCallIssue = false
reportImplicitOverride = false
reportUnusedCallResult = false
root = "tests"

[[tool.pyright.executionEnvironments]]
reportUnusedCallResult = false
root = "examples/usage"

[tool.pytype]
inputs = [
    "src",
    "tests",
]

# * Dependency creation --------------------------------------------------------

[tool.pyproject2conda]
user-config = "config/userconfig.toml"
template-python = "requirements/py{py}-{env}"
template = "requirements/{env}"
name = "py{py}-{env}"
python = "default"
channels = "conda-forge"
style = "yaml"
deps = "pip"

[tool.pyproject2conda.dependencies]
pytest-accept = { pip = true }
matplotlib = { skip = true, packages = "matplotlib-base" }
lazy-loader = { skip = true, packages = "lazy_loader" }
dask = { skip = true, packages = "dask" }
gpflow = { pip = true }
tensorflow = { pip = true }
tensorflow-probability = { pip = true }
pymbar = { pip = true }
jax = { pip = true }
module-utilities = { packages = "docstring-inheritance" }

[tool.pyproject2conda.envs.dev]
groups = [ "dev" ]
python = "default"

[tool.pyproject2conda.envs.test]
groups = [ "test" ]
python = "all"

[tool.pyproject2conda.envs.test-extras]
groups = [ "test-extras" ]
skip-package = true
python = "all"

[tool.pyproject2conda.envs.uvx-tools]
reqs = [
    # these used solely for specking tools to be used with uvx ...
    "basedpyright>=1.31.3",
    "conda-lock>=2.5.5",
    "cruft",
    "grayskull>=2.5.3",
    "nbqa>=1.8.4",
    "prek",
    "pyrefly>=0.37.0",
    "pyright>=1.1.396",
    "scriv",
    "twine>=5.0.0",
    "ty",
]
groups = [
    "mypy",
    "nox",
]
skip-package = true
style = "requirements"

# * Other tools ----------------------------------------------------------------

[tool.scriv]
format = "md"
md_header_level = "2"
new_fragment_template = "file: changelog.d/templates/new_fragment.md.j2"

[tool.commitizen]
use_shortcuts = true
